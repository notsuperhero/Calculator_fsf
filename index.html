<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculator</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

        :root {
            --background: 45 100% 96%;
            --foreground: 250 30% 25%;
            --card: 0 0% 100%;
            --primary: 173 58% 45%;
            --primary-foreground: 0 0% 100%;
            --secondary: 280 45% 65%;
            --muted: 45 40% 90%;
            --muted-foreground: 250 20% 45%;
            --destructive: 0 75% 60%;
            --destructive-foreground: 0 0% 100%;
            --coral: 10 80% 65%;
            --coral-foreground: 0 0% 100%;
            --border: 45 30% 85%;
            --radius: 1rem;
            --radius-xl: 2rem;

            --gradient-bg: linear-gradient(180deg, hsl(45 100% 96%) 0%, hsl(45 60% 92%) 100%);
            --shadow-playful: 0 8px 30px -10px hsl(250 30% 25% / 0.15);
            --shadow-button: 0 4px 15px -3px hsl(250 30% 25% / 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--gradient-bg);
            color: hsl(var(--foreground));
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            color: inherit;
        }

        .font-fredoka { font-family: 'Fredoka', sans-serif; }
        .font-nunito { font-family: 'Nunito', sans-serif; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }

        .text-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .text-display {
            font-size: 3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-sub-display {
            font-size: 1.125rem;
            color: hsl(var(--muted-foreground));
            height: 1.75rem;
        }

        .container {
            max-width: 24rem;
            width: 100%;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .col-span-2 {
            grid-column: span 2;
        }

        .card {
            background-color: hsl(var(--card));
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow-playful);
        }

        .display-area {
            background-color: hsl(var(--muted));
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: transform 0.2s;
            box-shadow: var(--shadow-button);
        }

        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        .btn-sq {
            width: 100%;
            aspect-ratio: 1;
            font-size: 1.5rem;
        }

        .btn.col-span-2 {
            aspect-ratio: auto;
        }

        .btn-primary { background: hsl(var(--primary)); color: white; }
        .btn-destructive { background: hsl(var(--destructive)); color: white; }
        .btn-muted { background: hsl(var(--muted)); }
        .btn-coral { background: hsl(var(--coral)); color: white; }
        .btn-card {
            background: hsl(var(--card));
            border: 2px solid hsl(var(--border));
        }
    </style>
</head>

<body>

    <h1 class="text-title font-fredoka font-bold text-center">Calculator</h1>

    <div class="container">
        <div class="card">
            <div class="display-area">
                <div id="calc-display" class="text-display font-fredoka font-bold text-right">0</div>
                <div id="calc-sub-display" class="text-sub-display font-nunito text-right"></div>
            </div>

            <div class="grid-4">
                <button data-calc-action="clear" class="btn btn-sq btn-destructive">AC</button>
                <button data-calc-action="sign" class="btn btn-sq btn-muted">±</button>
                <button data-calc-action="percent" class="btn btn-sq btn-muted">%</button>
                <button data-calc-action="operator" data-calc-value="÷" class="btn btn-sq btn-coral">÷</button>

                <button data-calc-action="number" data-calc-value="7" class="btn btn-sq btn-card">7</button>
                <button data-calc-action="number" data-calc-value="8" class="btn btn-sq btn-card">8</button>
                <button data-calc-action="number" data-calc-value="9" class="btn btn-sq btn-card">9</button>
                <button data-calc-action="operator" data-calc-value="×" class="btn btn-sq btn-coral">×</button>

                <button data-calc-action="number" data-calc-value="4" class="btn btn-sq btn-card">4</button>
                <button data-calc-action="number" data-calc-value="5" class="btn btn-sq btn-card">5</button>
                <button data-calc-action="number" data-calc-value="6" class="btn btn-sq btn-card">6</button>
                <button data-calc-action="operator" data-calc-value="-" class="btn btn-sq btn-coral">-</button>

                <button data-calc-action="number" data-calc-value="1" class="btn btn-sq btn-card">1</button>
                <button data-calc-action="number" data-calc-value="2" class="btn btn-sq btn-card">2</button>
                <button data-calc-action="number" data-calc-value="3" class="btn btn-sq btn-card">3</button>
                <button data-calc-action="operator" data-calc-value="+" class="btn btn-sq btn-coral">+</button>

                <button data-calc-action="number" data-calc-value="0" class="btn btn-sq btn-card col-span-2">0</button>
                <button data-calc-action="decimal" class="btn btn-sq btn-card">.</button>
                <button data-calc-action="calculate" class="btn btn-sq btn-primary">=</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById("calc-display");
        const subDisplay = document.getElementById("calc-sub-display");
        const buttons = document.querySelectorAll("[data-calc-action]");

        let state = {
            display: "0",
            prev: null,
            operator: null,
            wait: false
        };

        function updateDisplay() {
            display.textContent = state.display;
            subDisplay.textContent = state.operator && state.prev ? `${state.prev} ${state.operator}` : "";
        }

        function calculate(a, b, op) {
            switch (op) {
                case "+": return a + b;
                case "-": return a - b;
                case "×": return a * b;
                case "÷": return b === 0 ? 0 : a / b;
                default: return b;
            }
        }

        buttons.forEach(btn => {
            btn.onclick = () => {
                const action = btn.dataset.calcAction;
                const value = btn.dataset.calcValue;

                if (action === "number") {
                    state.display = state.wait ? value : (state.display === "0" ? value : state.display + value);
                    state.wait = false;
                }

                if (action === "decimal" && !state.display.includes(".")) {
                    state.display += ".";
                }

                if (action === "clear") {
                    state = { display: "0", prev: null, operator: null, wait: false };
                }

                if (action === "sign") {
                    state.display = String(Number(state.display) * -1);
                }

                if (action === "percent") {
                    state.display = String(Number(state.display) / 100);
                }

                if (action === "operator") {
                    state.prev = state.prev === null ? state.display : calculate(Number(state.prev), Number(state.display), state.operator);
                    state.operator = value;
                    state.display = String(state.prev);
                    state.wait = true;
                }

                if (action === "calculate" && state.operator) {
                    state.display = String(calculate(Number(state.prev), Number(state.display), state.operator));
                    state.prev = null;
                    state.operator = null;
                    state.wait = true;
                }

                updateDisplay();
            };
        });

        updateDisplay();
    </script>

</body>
</html>
